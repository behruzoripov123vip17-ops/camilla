services:
  - type: web
    name: camilla-beauty-studio
    runtime: python
    plan: free
    buildCommand: "python3 -m compileall backend.py manage.py"
    startCommand: "python3 manage.py runserver 0.0.0.0:$PORT"
    healthCheckPath: /api/services
    autoDeploy: true
    envVars:
      - key: CAMILLA_GOOGLE_CLIENT_ID
        sync: false
      - key: CAMILLA_OWNER_PASSWORD
        sync: false
      - key: CAMILLA_SMTP_HOST
        sync: false
      - key: CAMILLA_SMTP_PORT
        value: "465"
      - key: CAMILLA_SMTP_USER
        sync: false
      - key: CAMILLA_SMTP_PASSWORD
        sync: false
