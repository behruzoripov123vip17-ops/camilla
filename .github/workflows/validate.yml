name: Validate CAMILLA

on:
  push:
    branches: [main, "safety/**"]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile backend.py manage.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JavaScript syntax
        run: |
          for file in app.js js/app.js js/account.js js/dashboard.js js/i18n.js performance.js; do
            node --check "$file"
          done
